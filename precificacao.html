<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apostila · Precifica Ecosol — Manual de precificação solidária</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f5f0e1; --card:#fffdf6; --ink:#22301f; --ink-soft:#5c6854;
  --green:#1e6b4f; --green-deep:#0e3b2a; --green-soft:#e2efe3;
  --sun:#eea320; --sun-deep:#b97a05; --sun-soft:#fbf0d6;
  --clay:#c0502f; --clay-soft:#f8e5dc; --blue-soft:#e4eef4; --blue:#5b93b5;
  --line:#d9d0b6; --line-strong:#b3a887;
  --mono:'IBM Plex Mono',monospace; --disp:'Bricolage Grotesque',sans-serif; --body:'Instrument Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);color:var(--ink);background:var(--paper);line-height:1.6;font-size:15px}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(rgba(30,107,79,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(30,107,79,.05) 1px,transparent 1px);
  background-size:26px 26px;}
::selection{background:var(--sun);color:#2b1d02}
#printBtn{position:fixed;right:22px;bottom:22px;z-index:50;background:var(--green);color:#fff;border:2px solid var(--green-deep);
  border-radius:99px;padding:12px 22px;font-weight:700;font-size:.95rem;box-shadow:0 4px 0 var(--green-deep),0 14px 30px -12px rgba(0,0,0,.4);cursor:pointer;transition:.15s}
#printBtn:hover{transform:translateY(-2px)}
.sheet{max-width:880px;margin:34px auto;background:var(--card);border:1.5px solid var(--line);border-radius:14px;
  box-shadow:0 16px 34px -18px rgba(34,48,31,.4);padding:52px 62px;position:relative}
.sheet.chapter{break-before:page}
.cover{text-align:center;overflow:hidden}
.bunting{height:44px;overflow:hidden;margin:-52px -62px 26px;border-bottom:3px solid rgba(34,48,31,.28)}
.flagrow{display:flex;justify-content:center;gap:9px}
.flag{width:30px;height:36px;clip-path:polygon(0 0,100% 0,50% 100%)}
.flag:nth-child(5n+1){background:var(--green)} .flag:nth-child(5n+2){background:var(--sun)}
.flag:nth-child(5n+3){background:var(--clay)} .flag:nth-child(5n+4){background:#7fb0cf}
.flag:nth-child(5n){background:#8faf52}
.stamp{width:110px;height:110px;margin:6px auto 18px;border-radius:50%;background:var(--sun);border:3px solid var(--sun-deep);
  box-shadow:inset 0 0 0 5px var(--sun),inset 0 0 0 8px var(--sun-deep),0 8px 18px -8px rgba(0,0,0,.35);
  display:grid;place-content:center;transform:rotate(-8deg);
  font-family:var(--disp);font-weight:800;font-size:.95rem;letter-spacing:.08em;color:#3a2504;line-height:1.25}
.cover h1{font-family:var(--disp);font-weight:800;font-size:clamp(2.2rem,5vw,3.4rem);line-height:1.05}
.cover h1 em{font-style:italic;color:var(--green)}
.cover .sub{font-size:1.05rem;color:var(--ink-soft);max-width:52ch;margin:14px auto 0}
.cover .kind{display:inline-block;margin-top:22px;background:var(--green-soft);border:1.5px solid var(--green);color:var(--green-deep);
  border-radius:99px;padding:6px 18px;font-weight:700;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase}
.authors{margin:26px auto 0;max-width:500px;background:#fff;border:1.5px dashed var(--line-strong);border-radius:12px;padding:14px 18px;font-size:.88rem}
.authors b{color:var(--green-deep)}
.edition{margin-top:14px;font-size:.8rem;color:var(--ink-soft)}
.toc{list-style:none;margin:18px 0}
.toc li a{display:flex;align-items:baseline;gap:10px;text-decoration:none;color:var(--ink);padding:7px 4px;border-radius:8px;transition:.12s}
.toc li a:hover{background:var(--green-soft);padding-left:10px}
.toc .c{font-family:var(--disp);font-weight:800;color:var(--green);min-width:34px}
.toc .dots{flex:1;border-bottom:2px dotted var(--line-strong);transform:translateY(-4px)}
.toc .t{font-weight:600}
.ch-head{display:flex;gap:18px;align-items:center;border-bottom:3px solid var(--green);padding-bottom:12px;margin-bottom:20px}
.ch-num{font-family:var(--disp);font-weight:800;font-size:3.1rem;line-height:.9;color:var(--green);text-shadow:4px 4px 0 rgba(238,163,32,.35)}
.ch-head h2{font-family:var(--disp);font-weight:800;font-size:1.6rem}
.ch-head p{font-size:.9rem;color:var(--ink-soft)}
h3.sec{font-family:var(--disp);font-weight:700;font-size:1.12rem;margin:24px 0 8px;color:var(--green-deep)}
h4.q{font-family:var(--disp);font-weight:700;font-size:.98rem;margin:16px 0 4px}
p{margin:8px 0}
ul.plain{margin:8px 0 8px 20px}
ul.plain li{margin:4px 0}
.bx{border-radius:10px;padding:12px 16px;margin:14px 0;font-size:.92rem;border:1.5px solid;break-inside:avoid}
.bx .t{display:block;font-family:var(--disp);font-weight:700;margin-bottom:4px}
.bx-dica{background:var(--green-soft);border-color:var(--green)}
.bx-at{background:var(--clay-soft);border-color:var(--clay)}
.bx-ex{background:var(--sun-soft);border-color:var(--sun-deep)}
.bx-conc{background:var(--blue-soft);border-color:var(--blue)}
.step{display:flex;gap:12px;margin:12px 0;break-inside:avoid}
.step .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--green);color:#fff;font-weight:800;display:grid;place-items:center;font-family:var(--disp);margin-top:2px}
.step .bd{flex:1}
.step .bd b.hl{background:linear-gradient(transparent 55%,var(--sun-soft) 55%)}
.tbl{width:100%;border-collapse:collapse;margin:12px 0;font-size:.87rem;break-inside:avoid}
.tbl th{background:var(--green-deep);color:#fff;text-align:left;padding:7px 10px;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em}
.tbl td{border-top:1.5px dashed var(--line);padding:7px 10px;vertical-align:top}
.tbl td.num,.tbl th.num{text-align:right;font-family:var(--mono)}
.tbl tr.total td{background:var(--sun-soft);font-weight:700}
.flow{display:flex;flex-direction:column;align-items:stretch;gap:0;margin:16px auto;max-width:560px}
.flow .nd{border:2px solid var(--green);border-radius:10px;padding:9px 16px;background:#fff;font-size:.9rem;text-align:center}
.flow .nd b{font-family:var(--disp)}
.flow .nd.gold{border-color:var(--sun-deep);background:var(--sun-soft)}
.flow .nd.deep{border-color:var(--green-deep);background:var(--green);color:#fff}
.flow .ar{text-align:center;color:var(--green);line-height:1.15;font-size:.78rem;padding:2px 0}
.check{margin:10px 0 10px 4px;list-style:none}
.check li{display:flex;gap:10px;align-items:baseline;margin:7px 0;break-inside:avoid}
.check .box{flex:none;width:15px;height:15px;border:2px solid var(--ink);border-radius:4px;transform:translateY(2px)}
kbd{font-family:var(--mono);background:#efe9d8;border:1.5px solid var(--line-strong);border-radius:6px;padding:1px 7px;font-size:.82em}
.small{font-size:.82rem;color:var(--ink-soft)}
.credits-final{margin-top:30px;border-top:2px dashed var(--line-strong);padding-top:16px;font-size:.85rem;text-align:center;color:var(--ink-soft)}
.credits-final b{color:var(--green-deep)}
@media(max-width:720px){
  .sheet{padding:30px 22px;margin:16px 10px}
  .bunting{margin:-30px -22px 22px}
}
@media print{
  @page{size:A4;margin:13mm 12mm}
  body{background:#fff}
  #printBtn{display:none!important}
  .sheet{border:none;box-shadow:none;border-radius:0;margin:0;max-width:none;padding:0}
  .bunting{margin:0 0 22px}
  a{color:inherit;text-decoration:none}
  .bx,.step,.tbl,.ch-head{break-inside:avoid}
}
</style>
</head>
<body>

<button id="printBtn" onclick="window.print()">🖨 Imprimir / Salvar PDF</button>
