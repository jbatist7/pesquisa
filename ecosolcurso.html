<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trilha de Formação — Economia Solidária</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFE6D0;
    --paper-deep:#E4D8B7;
    --paper-line:#CBB98C;
    --ink:#141C0F;
    --ink-soft:#3A4330;
    --green:#2E4A29;
    --green-deep:#1E331B;
    --brick:#8A3D22;
    --brick-deep:#6E2F18;
    --indigo:#1F4550;
    --plum:#452C42;
    --gold:#7A5710;
    --gold-fill:#C99A3A;
    --correct:#3A5320;
    --wrong:#7A2A1F;
    --shadow: 0 2px 0 rgba(20,28,15,0.12), 0 8px 20px -12px rgba(20,28,15,0.4);
    --radius: 4px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      radial-gradient(rgba(34,48,31,0.035) 1px, transparent 1px);
    background-size: 4px 4px;
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    line-height:1.55;
  }
  h1,h2,h3,h4{
    font-family:'Zilla Slab', serif;
    color:var(--ink);
    margin:0 0 .5em 0;
    line-height:1.15;
  }
  p{margin:0 0 1em 0;}
  a{color:var(--indigo);}
  ::selection{background:var(--gold-fill); color:var(--ink);}
  .mono{font-family:'IBM Plex Mono', monospace; letter-spacing:.02em;}

  /* ---------- layout shells ---------- */
  .wrap{max-width:1080px; margin:0 auto; padding:0 20px;}
  .visually-hidden{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0);}

  a:focus-visible, button:focus-visible, input:focus-visible, label:focus-visible{
    outline:3px solid var(--indigo); outline-offset:2px;
  }

  /* ---------- top banner (curso + frase de efeito) ---------- */
  .top-banner{
    background:var(--green-deep); color:var(--paper); text-align:center;
    padding:24px 20px 22px;
  }
  .top-banner .course-title{
    font-family:'Zilla Slab',serif; font-weight:700; font-size:clamp(1.9rem, 4vw, 2.7rem);
    line-height:1.15; margin:0 0 14px 0; color:var(--paper);
  }
  .top-banner .tagline{
    font-family:'Zilla Slab',serif; font-style:italic; font-size:.95rem; line-height:1.5;
    max-width:52ch; margin:0 auto; color:var(--paper); opacity:.97;
  }
  .top-banner .byline{
    font-family:'IBM Plex Mono',monospace; font-size:.76rem; letter-spacing:.04em;
    margin:12px 0 0 0; color:var(--paper); opacity:.82;
  }

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:40;
    background:var(--paper); border-bottom:1px solid var(--paper-line);
    backdrop-filter:saturate(1.1);
  }
  .topbar-inner{display:flex; align-items:center; justify-content:space-between; padding:12px 0; gap:16px;}
  .brand{display:flex; align-items:center; gap:10px; font-family:'Zilla Slab',serif; font-weight:600; font-size:1.05rem; cursor:pointer; background:none; border:none; color:var(--ink); padding:0;}
  .brand .brand-mark{
    width:30px; height:30px; border-radius:50%;
    border:2px solid var(--brick); display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-size:.7rem; font-weight:600; color:var(--brick);
    transform:rotate(-6deg);
  }
  .progress-pill{
    font-family:'IBM Plex Mono',monospace; font-size:.75rem; color:var(--ink-soft);
    border:1px solid var(--paper-line); border-radius:999px; padding:5px 12px;
    display:flex; align-items:center; gap:8px; white-space:nowrap;
  }
  .progress-pill .bar{width:70px; height:5px; background:var(--paper-deep); border-radius:3px; overflow:hidden;}
  .progress-pill .bar > span{display:block; height:100%; background:var(--green);}

  .trilha-nav{display:flex; gap:8px; overflow-x:auto; padding:0 0 12px 0; scrollbar-width:thin;}
  .trilha-nav a{
    flex:0 0 auto; text-decoration:none; font-size:.78rem; font-weight:700;
    padding:6px 12px; border-radius:999px; border:1.5px solid currentColor;
    color:var(--tag-color, var(--ink-soft)); white-space:nowrap;
    transition:background-color .12s ease, color .12s ease;
  }
  .trilha-nav a.active{
    background:var(--tag-color, var(--ink-soft)); color:var(--paper);
  }

  .signup-strip{
    background:var(--paper-deep); border:1px solid var(--paper-line); border-radius:2px;
    padding:14px 16px; margin:16px 0 0 0; font-size:.85rem; color:var(--ink-soft);
  }
  .signup-strip p{margin:0 0 6px 0;}
  .signup-strip p:last-child{margin-bottom:0;}
  .signup-strip a{color:var(--indigo); font-weight:700; word-break:break-word;}

  /* ---------- hero ---------- */
  .hero{padding:44px 0 24px 0;}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace; font-size:.72rem; letter-spacing:.12em; text-transform:uppercase;
    color:var(--brick); margin-bottom:10px; display:block;
  }
  .hero h1{font-size:clamp(1.9rem, 4vw, 2.7rem); max-width:16ch;}
  .hero .lede{max-width:62ch; font-size:1.05rem; color:var(--ink-soft);}

  .trail-svg{width:100%; height:auto; margin:22px 0 6px 0; display:block;}

  .callout{
    background:var(--paper-deep); border:1px solid var(--paper-line); border-left:4px solid var(--gold);
    border-radius:2px; padding:16px 18px; margin:20px 0; font-size:.93rem; color:var(--ink-soft);
  }
  .callout strong{color:var(--ink);}

  /* ---------- trilha sections ---------- */
  .trilha-section{padding:38px 0 6px 0; scroll-margin-top:150px;}
  .trilha-head{display:flex; align-items:baseline; gap:14px; margin-bottom:6px; flex-wrap:wrap;}
  .trilha-head h2{font-size:1.5rem; color:var(--trilha-color);}
  .trilha-head .trilha-desc{color:var(--ink-soft); font-size:.92rem; max-width:60ch; margin-bottom:20px;}

  .module-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(250px,1fr)); gap:16px; margin-bottom:8px;
  }
  .module-card{
    text-align:left; cursor:pointer; background:var(--paper-deep); border:1px solid var(--paper-line);
    border-radius:var(--radius); padding:18px 16px 16px 16px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; gap:10px; font-family:inherit; color:inherit;
    transition:transform .12s ease, box-shadow .12s ease;
    position:relative;
  }
  .module-card:hover{transform:translateY(-2px);}
  .stamp{
    width:44px; height:44px; flex:0 0 auto;
    border:2px solid var(--card-color, var(--brick));
    border-radius:48% 52% 51% 49% / 52% 48% 53% 47%;
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:.85rem;
    color:var(--card-color, var(--brick));
    transform:rotate(var(--stamp-rot, -4deg));
    mix-blend-mode:multiply;
    position:relative;
  }
  .stamp::after{
    content:''; position:absolute; inset:4px;
    border:1px solid var(--card-color, var(--brick));
    border-radius:48% 52% 51% 49% / 52% 48% 53% 47%;
    opacity:.55;
  }
  .card-title{font-family:'Zilla Slab',serif; font-weight:600; font-size:1.05rem;}
  .card-teaser{font-size:.86rem; color:var(--ink-soft); flex-grow:1;}
  .card-foot{display:flex; align-items:center; justify-content:space-between; font-size:.72rem;}
  .card-status{
    font-family:'IBM Plex Mono',monospace; padding:3px 9px; border-radius:999px; border:1px solid var(--paper-line); color:var(--ink-soft);
  }
  .card-status.done{border-color:var(--correct); color:var(--correct); background:rgba(76,107,42,.08);}
  .card-cta{color:var(--card-color,var(--brick)); font-weight:600;}

  /* ---------- module detail view ---------- */
  .module-view{padding:30px 0 70px 0;}
  .back-btn{
    background:var(--brick); border:none; border-radius:999px; padding:12px 22px 12px 18px;
    font-family:'IBM Plex Mono',monospace; font-size:.85rem; font-weight:700; letter-spacing:.02em;
    cursor:pointer; color:var(--paper); margin-bottom:26px;
    display:inline-flex; align-items:center; gap:8px; box-shadow:var(--shadow);
  }
  .back-btn:hover{background:var(--brick-deep);}
  .module-head{display:flex; gap:18px; align-items:center; margin-bottom:6px;}
  .module-head .stamp{width:58px; height:58px; font-size:1rem;}
  .module-eyebrow{font-family:'IBM Plex Mono',monospace; font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--card-color);}
  .module-head h1{font-size:clamp(1.5rem,3.2vw,2.1rem); margin:0;}

  .tabs{display:flex; gap:4px; margin:26px 0 22px 0; border-bottom:1px solid var(--paper-line);}
  .tab-btn{
    background:none; border:none; font-family:'IBM Plex Mono',monospace; font-size:.82rem; font-weight:600;
    padding:10px 4px; margin-right:22px; cursor:pointer; color:var(--ink-soft); border-bottom:2px solid transparent; letter-spacing:.02em;
  }
  .tab-btn.active{color:var(--ink); border-bottom-color:var(--brick);}

  .content-panel{max-width:70ch;}
  .content-panel h3{font-size:1.15rem; margin-top:1.6em; color:var(--ink);}
  .content-panel h3:first-child{margin-top:0;}
  .content-panel ul, .content-panel ol{padding-left:1.2em; margin:0 0 1em 0;}
  .content-panel li{margin-bottom:.4em;}
  .content-panel .note{
    background:var(--paper-deep); border:1px solid var(--paper-line); border-left:4px solid var(--indigo);
    padding:12px 16px; font-size:.9rem; color:var(--ink-soft); margin:1.3em 0;
  }

  .module-nav{
    display:flex; justify-content:space-between; align-items:stretch; gap:12px;
    margin-top:40px; padding-top:24px; border-top:1px solid var(--paper-line); flex-wrap:wrap;
  }
  .module-nav-btn{
    display:flex; flex-direction:column; gap:4px; max-width:47%;
    background:var(--paper-deep); border:1px solid var(--paper-line); border-radius:2px;
    padding:12px 16px; cursor:pointer; text-align:left; font-family:inherit;
  }
  .module-nav-btn.next{ margin-left:auto; text-align:right; align-items:flex-end; background:var(--green-deep); border:none; }
  .module-nav-btn .module-nav-label{
    font-family:'IBM Plex Mono',monospace; font-size:.72rem; letter-spacing:.04em; color:var(--ink-soft);
  }
  .module-nav-btn.next .module-nav-label{ color:var(--paper); opacity:.85; }
  .module-nav-btn .module-nav-title{ font-family:'Zilla Slab',serif; font-weight:600; font-size:.98rem; color:var(--ink); }
  .module-nav-btn.next .module-nav-title{ color:var(--paper); }
  .module-nav-btn.prev:hover{ border-color:var(--ink-soft); }
  .module-nav-btn.next:hover{ background:var(--green); }
  .module-nav-done{
    margin-left:auto; font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--correct);
    align-self:center;
  }

  /* ---------- quiz ---------- */
  .quiz-panel{max-width:70ch;}
  .quiz-score{
    display:none; align-items:flex-start; gap:14px; padding:16px; border-radius:2px; margin-bottom:22px;
    border:1px solid var(--paper-line); background:var(--paper-deep); font-size:.92rem;
  }
  .quiz-score.show{display:flex;}
  .quiz-score .stamp{width:46px; height:46px; font-size:.7rem; flex:0 0 auto;}
  .quiz-score-body{display:flex; flex-direction:column; gap:12px; align-items:flex-start;}
  .next-module-btn{}
  .question-block{margin-bottom:30px; padding-bottom:26px; border-bottom:1px dashed var(--paper-line);}
  .question-block:last-of-type{border-bottom:none;}
  .question-block legend, .q-text{font-family:'Zilla Slab',serif; font-weight:600; font-size:1.02rem; margin-bottom:12px; padding:0; display:block;}
  .options{display:flex; flex-direction:column; gap:8px; list-style:none; margin:0; padding:0;}
  .option-label{
    display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border:1px solid var(--paper-line);
    border-radius:2px; cursor:pointer; background:var(--paper); font-size:.93rem;
  }
  .option-label:hover{border-color:var(--ink-soft);}
  .option-label input{margin-top:3px;}
  .option-label.correct{border-color:var(--correct); background:rgba(76,107,42,.1);}
  .option-label.wrong{border-color:var(--wrong); background:rgba(150,56,43,.08);}
  .explain{font-size:.87rem; color:var(--ink-soft); margin-top:10px; padding:10px 12px; background:var(--paper-deep); border-left:3px solid var(--gold); display:none;}
  .explain.show{display:block;}
  .quiz-actions{display:flex; gap:12px; margin-top:8px; flex-wrap:wrap;}
  .btn{
    font-family:'IBM Plex Mono',monospace; font-size:.82rem; font-weight:600; letter-spacing:.02em;
    padding:11px 22px; border-radius:2px; border:none; cursor:pointer;
  }
  .btn-primary{background:var(--green-deep); color:var(--paper);}
  .btn-primary:hover{background:var(--green);}
  .btn-ghost{background:none; border:1px solid var(--paper-line); color:var(--ink-soft);}
  .btn-ghost:hover{border-color:var(--ink-soft); color:var(--ink);}
  .quiz-hint{font-size:.82rem; color:var(--ink-soft); margin-top:6px;}

  footer{border-top:1px solid var(--paper-line); padding:26px 0 50px 0; margin-top:40px;}
  footer p{font-size:.82rem; color:var(--ink-soft); margin:0 0 8px 0; max-width:60ch;}
  footer p:last-child{margin-bottom:0;}
  footer .credits{color:var(--ink); font-weight:600;}
  footer a{color:var(--indigo); font-weight:600;}

  @media (max-width:640px){
    .module-head{align-items:flex-start;}
    .module-head .stamp{width:46px;height:46px;font-size:.85rem;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   DADOS: trilhas e módulos
   ============================================================ */
const TRILHAS = {
  fundamentos: { label:'Fundamentos da Economia Solidária', color:'var(--indigo)', hex:'#1F4550',
    desc:'Os princípios que diferenciam a economia solidária de um negócio comum: propriedade coletiva, autogestão e participação política.' },
  gestao: { label:'Planejamento e Gestão', color:'var(--green)', hex:'#2E4A29',
    desc:'As ferramentas para organizar o dia a dia do empreendimento: planejar, administrar, controlar dinheiro.' },
  mercado: { label:'Mercado e Comercialização', color:'var(--brick)', hex:'#8A3D22',
    desc:'Do produto até a venda: o que produzir, para quem, por quanto e por onde escoar.' },
  politicas: { label:'Políticas Públicas e Projetos', color:'var(--plum)', hex:'#452C42',
    desc:'Como acessar crédito, editais e cadastros públicos sem se perder na burocracia.' },
  territorio: { label:'Território, Produção e Tecnologia', color:'var(--gold)', hex:'#7A5710',
    desc:'A base produtiva do grupo e as ferramentas digitais que hoje atravessam tudo isso.' },
};

const MODULES = [];

MODULES.push({
  id:'economia-solidaria', num:1, trilha:'fundamentos',
  title:'Economia Popular e Solidária',
  teaser:'O que diferencia um empreendimento solidário de uma empresa comum — e por que isso muda tudo na prática.',
  content:`
    <h3>O que é</h3>
    <p>Economia solidária é um jeito de organizar trabalho, produção, comercialização, crédito e consumo baseado em três coisas ao mesmo tempo: propriedade coletiva ou associada dos meios de produção, autogestão (quem trabalha também decide) e cooperação em vez de competição. Cabem aí cooperativas, associações, grupos informais organizados coletivamente, redes de troca, feiras solidárias e bancos comunitários.</p>
    <h3>A diferença real para uma empresa comum</h3>
    <p>Numa empresa tradicional, o capital contrata trabalho: quem investiu decide e fica com o lucro; quem trabalha recebe salário. Na economia solidária essa separação não existe — ou existe bem menos. As pessoas que produzem também são, coletivamente, donas do empreendimento e decidem o que fazer com o resultado do trabalho, chamado geralmente de "sobras" em vez de "lucro", porque a lógica de divisão é outra: por trabalho realizado, por produção entregue, por necessidade, conforme o grupo combinar.</p>
    <h3>Por que isso importa na prática</h3>
    <p>Entender esse princípio evita repetir, sem perceber, a lógica de patrão-empregado dentro do próprio grupo — por exemplo, uma coordenação que decide sozinha "porque é mais prático" ou sobras que só uma pessoa controla. Também é a base para acessar políticas específicas de economia solidária: cadastro no Sistema Nacional de Economia Solidária (SIES), editais e linhas de crédito costumam pedir essa caracterização.</p>
    <h3>Como aplicar no seu grupo</h3>
    <ol>
      <li>Reuniões coletivas de decisão, com pauta e ata — mesmo que simples, em caderno.</li>
      <li>Regras escritas sobre entrada e saída de integrantes, divisão do trabalho e das sobras.</li>
      <li>Formalização gradual (associação, depois cooperativa, se fizer sentido) conforme o grupo amadurece — não é obrigatório começar formalizado.</li>
    </ol>
    <div class="note">O cadastro no SIES e as regras de cada linha de crédito ou edital de economia solidária mudam com o tempo. Antes de usar esse enquadramento para acessar uma política pública específica, confirme os critérios atuais com a entidade gestora ou uma incubadora/assessoria técnica.</div>
    <h3>Erros comuns</h3>
    <ul>
      <li>Confundir economia solidária com trabalho voluntário ou não remunerado — o trabalho deve ser remunerado e as sobras repartidas.</li>
      <li>Deixar toda a gestão nas mãos de uma pessoa "porque é mais prático", o que corrói a autogestão aos poucos.</li>
      <li>Não registrar as decisões, o que vira fonte de conflito quando alguém não lembra o que foi combinado.</li>
    </ul>
  `,
  quiz:[
    { q:'O que caracteriza principalmente um empreendimento de economia solidária, diferenciando-o de uma empresa tradicional?',
      options:['O uso de tecnologia mais simples','A autogestão coletiva e a propriedade associada dos meios de produção','O fato de não vender para o mercado','A ausência de qualquer remuneração pelo trabalho'],
      correct:1, explain:'Autogestão e propriedade coletiva/associada são os traços centrais. A economia solidária vende normalmente no mercado e remunera quem trabalha — a diferença está em quem decide e quem fica com o resultado.' },
    { q:'Uma cooperativa quer praticar autogestão de fato. Qual atitude é coerente com isso?',
      options:['Só a presidência decide sobre o uso das sobras','As decisões importantes são tomadas em assembleia, com atas registradas','As decisões são tomadas por quem investiu mais dinheiro no início','Não é necessário registrar decisões, basta confiar nas pessoas'],
      correct:1, explain:'Autogestão exige que as decisões relevantes passem pelo coletivo e fiquem registradas, para que todo mundo tenha acesso ao que foi combinado — inclusive quem não estava na reunião.' },
    { q:'Um grupo informal, sem CNPJ, mas que produz e vende coletivamente com decisões partilhadas, pode ser considerado economia solidária?',
      options:['Não, só cooperativas registradas contam','Sim — a formalização é recomendável, mas o que define é a prática de autogestão e cooperação','Não, é preciso ter pelo menos 20 associados','Sim, mas só se vender exclusivamente para o poder público'],
      correct:1, explain:'A formalização jurídica ajuda a acessar crédito e editais, mas não é o que define economia solidária — o critério central é a prática de autogestão e cooperação.' },
    { q:'Qual é um risco real quando um grupo concentra toda a gestão numa liderança, mesmo se dizendo "autogestionário"?',
      options:['Nenhum, desde que a liderança seja competente','O grupo perde automaticamente o direito a crédito','Reproduz por dentro a lógica de patrão-empregado e enfraquece a participação e a confiança','É obrigado por lei a se dissolver'],
      correct:2, explain:'Concentrar decisões numa só pessoa recria, na prática, a relação de patrão e empregado que a economia solidária busca superar — mesmo sem essa intenção.' },
  ]
});

MODULES.push({
  id:'autogestao-participacao', num:2, trilha:'fundamentos',
  title:'Práticas de Autogestão e Participação Coletiva',
  teaser:'As rotinas concretas que fazem a autogestão acontecer de verdade — não só no discurso.',
  content:`
    <h3>O que é</h3>
    <p>Autogestão não é ausência de organização — é o oposto. É um conjunto de rotinas e regras claras que garantem que as decisões sejam tomadas coletivamente, com informação circulando entre todos. Participação coletiva é o exercício constante dessas rotinas: quem participa, com que frequência, com que poder de fala e de voto.</p>
    <h3>Estruturas que sustentam a autogestão</h3>
    <ul>
      <li><strong>Assembleia geral:</strong> instância máxima de decisão, define regras, elege coordenação, aprova contas.</li>
      <li><strong>Coordenação ou diretoria rotativa:</strong> executa o que foi decidido, não decide sozinha o que é estratégico.</li>
      <li><strong>Conselho fiscal:</strong> acompanha as finanças de forma independente da coordenação, mesmo em grupos pequenos.</li>
      <li><strong>Regimento interno:</strong> regras escritas sobre entrada, saída, divisão de trabalho e de sobras, faltas e conflitos.</li>
    </ul>
    <h3>Sinais de que a autogestão está fraca</h3>
    <p>Reuniões que só informam decisões já tomadas; informação financeira que circula só entre duas ou três pessoas; a mesma pessoa ocupando toda função de destaque por anos; assembleias sem pauta prévia, onde ninguém teve tempo de pensar antes de votar.</p>
    <h3>Como fortalecer na prática</h3>
    <ol>
      <li>Defina uma periodicidade fixa de assembleia (mensal, bimestral) e cumpra.</li>
      <li>Envie a pauta com alguns dias de antecedência, mesmo que por um grupo de mensagens.</li>
      <li>Apresente as contas em linguagem simples e por escrito, não só de memória.</li>
      <li>Faça rodízio de funções de coordenação, com um período de transição em que a pessoa nova acompanha a antiga.</li>
    </ol>
    <h3>Erros comuns</h3>
    <ul>

MODULES.push({

  content:`
    <h3>O que é</h3>
    <p>Viabilidade de produto é a análise que verifica se, considerando custos, preço de venda possível e volume que dá para vender, aquele produto realmente compensa produzir. Um produto pode ser tecnicamente bom e ainda assim não ser viável — e um grupo sustentável precisa saber diferenciar as duas coisas.</p>
    <h3>O cálculo central: ponto de equilíbrio</h3>
    <p>Ponto de equilíbrio é a quantidade que precisa ser vendida para cobrir todos os custos, sem lucro nem prejuízo. Ele depende de três números: o custo fixo do período (o que se gasta independente de produzir muito ou pouco, como aluguel de um espaço ou manutenção de equipamento), o custo variável por unidade (o que se gasta a mais para cada unidade produzida, como insumo e embalagem) e o preço de venda. A conta básica é: ponto de equilíbrio = custo fixo dividido pela diferença entre o preço de venda e o custo variável por unidade.</p>
    <h3>Por que isso importa</h3>
    <p>Sem esse cálculo, é comum um grupo produzir com entusiasmo, vender tudo, e mesmo assim não sobrar dinheiro — porque o volume vendido nunca alcançou o ponto de equilíbrio. Fazer essa conta, mesmo de forma simples, evita continuar investindo tempo e recurso num produto que estruturalmente não fecha as contas, a não ser que algo mude (preço, custo, ou volume).</p>
    <h3>Como aplicar</h3>
    <ol>
      <li>Liste os custos fixos do período (mês, safra) e os custos variáveis por unidade produzida.</li>
      <li>Calcule o ponto de equilíbrio com a fórmula acima.</li>
      <li>Compare com o volume que o grupo realisticamente consegue vender, com base no estudo de mercado.</li>
      <li>Se o volume necessário for maior do que o mercado absorve, revise preço, custo ou escala — ou reconsidere o produto.</li>
    </ol>
    <h3>Erros comuns</h3>
    <ul>
      <li>Calcular viabilidade só uma vez, no início, e nunca refazer quando o custo de um insumo sobe.</li>
      <li>Ignorar custos "pequenos" (transporte até a feira, taxa de máquina de cartão, embalagem) no cálculo.</li>
      <li>Confundir "estamos vendendo tudo que produzimos" com "o produto é viável" — são perguntas diferentes.</li>
    </ul>
  `,
  quiz:[
    { q:'O que é o ponto de equilíbrio de um produto?',
      options:['O preço médio praticado pela concorrência','A quantidade que precisa ser vendida para cobrir todos os custos, sem lucro nem prejuízo','O valor total investido na produção do primeiro lote','A margem de lucro desejada pelo grupo'],
      correct:1, explain:'O ponto de equilíbrio marca a fronteira entre prejuízo e lucro: abaixo dele o grupo perde dinheiro produzindo aquele item, acima dele começa a sobrar algo.' },

      correct:1, explain:'Quando a conta não fecha com o mercado real disponível, é sinal de que algo na equação (preço, custo ou escala) precisa mudar, ou que o produto talvez não seja a melhor aposta agora.' },
    { q:'Por que é importante refazer o cálculo de viabilidade quando o custo de um insumo sobe?',
      options:['Porque o ponto de equilíbrio pode mudar, exigindo ajuste de preço ou volume de venda','Porque a lei exige recálculo formal a cada aumento de insumo','Porque isso é necessário apenas para produtos vendidos ao governo','Porque o cálculo de viabilidade nunca muda depois de feito uma vez'],

MODULES.push({

  teaser:'O marco legal (Lei 13.019/2014) que organiza a relação entre poder público e organizações da sociedade civil.',
  content:`
    <h3>O que é</h3>
    <p>MROSC é a sigla para Marco Regulatório das Organizações da Sociedade Civil, estabelecido principalmente pela Lei federal 13.019/2014. Ele define as regras para que o poder público (federal, estadual ou municipal) repasse recursos e estabeleça parcerias com organizações da sociedade civil — associações, cooperativas sociais, fundações — por meio de instrumentos como termo de colaboração, termo de fomento e acordo de cooperação.</p>
    <h3>Os principais instrumentos previstos</h3>
    <ul>
      <li><strong>Termo de colaboração:</strong> quando a proposta parte do poder público, geralmente por meio de chamamento público.</li>
      <li><strong>Termo de fomento:</strong> quando a proposta parte da própria organização da sociedade civil, também via chamamento público.</li>
      <li><strong>Acordo de cooperação:</strong> quando não há repasse de recurso financeiro do poder público, mas outros tipos de apoio mútuo.</li>
      <li><strong>Chamamento público:</strong> o processo de seleção que, via de regra, precede a celebração desses instrumentos — o equivalente a uma licitação, mas voltado a parcerias com organizações sem fins lucrativos.</li>
    </ul>
    <h3>Por que conhecer esse marco importa</h3>
    <p>Muitas parcerias entre prefeituras (ou governos estaduais) e associações e cooperativas de economia solidária — para gestão de espaços, execução de projetos sociais, feiras apoiadas pelo poder público — passam por esse marco legal. Entender a lógica básica (chamamento público, plano de trabalho, prestação de contas) ajuda o grupo a não ser pego de surpresa por exigências burocráticas no meio do processo.</p>
    <h3>Como se preparar</h3>
    <ol>
      <li>Verifique se a entidade (associação ou cooperativa) tem o registro e a documentação exigidos para celebrar parcerias com o poder público local.</li>
      <li>Acompanhe publicações de chamamento público do município ou estado nas áreas de interesse do grupo.</li>
      <li>Busque apoio de assessoria jurídica ou técnica ao elaborar o plano de trabalho, especialmente na primeira parceria.</li>
    </ol>
    <div class="note">Este é um resumo geral de um marco legal com muitos detalhes técnicos e prazos específicos. Antes de firmar qualquer parceria com base no MROSC, procure orientação jurídica ou técnica especializada — o não cumprimento de exigências formais pode gerar responsabilização da diretoria da organização.</div>
    <h3>Erros comuns</h3>
    <ul>

    <h3>O que é</h3>
    <p>Transição agroecológica é o processo, geralmente gradual, de mudar de um sistema produtivo dependente de insumos externos (adubo químico, agrotóxico, sementes compradas todo ano) para um sistema baseado em processos naturais do próprio território: manejo do solo, diversidade de cultivos, uso de insumos produzidos na propriedade ou na comunidade, e menor dependência de compras externas.</p>
    <h3>Por que "transição" e não uma troca de uma vez</h3>
    <p>Mudar de sistema de produção de forma abrupta costuma gerar queda temporária de produtividade, porque o solo e o sistema levam tempo para reequilibrar. Por isso a agroecologia costuma ser tratada como um processo em etapas, não uma troca de pacote tecnológico de um ano para o outro — o que exige planejamento financeiro para atravessar esse período de ajuste (ver módulo de Plano de Finanças).</p>
    <h3>Práticas comuns num processo de transição</h3>
    <ul>
      <li>Diversificação de cultivos, reduzindo a dependência de uma única cultura (monocultivo).</li>
      <li>Manejo do solo com adubação orgânica, cobertura vegetal e redução gradual de insumo químico.</li>
      <li>Uso e troca de sementes crioulas ou adaptadas à região, em vez de depender exclusivamente de sementes compradas.</li>
      <li>Consórcio de culturas e sistemas agroflorestais, quando o contexto e o conhecimento técnico local permitem.</li>
    </ul>
    <h3>Como aplicar</h3>
    <ol>
      <li>Comece a transição numa parte da área produtiva, não em toda de uma vez, para aprender e ajustar com menor risco.</li>
      <li>Busque apoio técnico de assistência rural especializada em agroecologia, redes de agroecologia da região e trocas com outros agricultores em transição.</li>
      <li>Planeje financeiramente o período de ajuste, considerando possível queda temporária de produtividade.</li>
      <li>Documente o processo (o que funcionou, o que não funcionou) — esse registro também costuma ser exigido em certificações e alguns editais.</li>
    </ol>
    <h3>Erros comuns</h3>
    <ul>
      <li>Tentar converter toda a área de uma vez, sem reserva financeira para o período de ajuste.</li>
      <li>Abandonar a transição ao primeiro ano de queda de produtividade, sem dar tempo do sistema reequilibrar.</li>
      <li>Fazer a transição isoladamente, sem buscar redes e trocas de experiência com quem já passou pelo processo.</li>
    </ul>

let progress = {};
let activeTrilha = null;
let state = { view:'home', moduleId:null, tab:'conteudo', answers:{} };

const PROGRESS_KEY = 'economia-solidaria-progress';
function loadProgress(){
  try{
    const raw = localStorage.getItem(PROGRESS_KEY);
    progress = raw ? JSON.parse(raw) : {};
  }catch(e){ progress = {}; }
}
function saveProgress(){
  try{ localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress)); }
  catch(e){ /* armazenamento local indisponível: o site continua funcionando, só não guarda o progresso entre sessões */ }
}

/* ============================================================
   RENDER: HOME
   ============================================================ */
function moduleStatus(id){
  const p = progress[id];
  if(!p) return null;
  return p;
}

function renderTopBanner(){
  return `
  <div class="top-banner">
    <p class="course-title">Curso Básico em Economia Solidária</p>
    <p class="tagline">"Nesse momento histórico de grandes mudanças, mulheres e homens descobriram que produzir e decidir juntos é mais forte do que produzir sozinhos."</p>
    <p class="byline">João Batista de Oliveira e Gáudia Maria Costa Leite Pereira</p>
  </div>`;
}

function renderTopbar(){
  const done = Object.keys(progress).length;
  const total = MODULES.length;
  const pct = total ? Math.round((done/total)*100) : 0;
  return `
  <div class="topbar">
    <div class="wrap topbar-inner">
      <button class="brand" onclick="goHome()">
        <span class="brand-mark">ES</span>
        Trilha de Formação

    </div>
  </div>`;
}

function updateNavActive(){
  document.querySelectorAll('.trilha-nav a').forEach(a=>{
    a.classList.toggle('active', a.dataset.trilha === activeTrilha);
  });
}

function goToTrilha(key){
  if(state.view !== 'home'){
    state.view='home'; state.moduleId=null; state.tab='conteudo';
    renderHome();
  }
  activeTrilha = key;
  updateNavActive();
  requestAnimationFrame(()=>{
    const link = document.querySelector('.trilha-nav a[data-trilha="'+key+'"]');
    if(link){ link.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'}); }
    const el = document.getElementById('trilha-'+key);
    if(el){ el.scrollIntoView({behavior:'smooth', block:'start'}); }
  });
}

let scrollObserver = null;
function setupScrollSpy(){
  if(scrollObserver){ scrollObserver.disconnect(); scrollObserver=null; }
  const sections = document.querySelectorAll('.trilha-section');
  if(!sections.length) return;
  scrollObserver = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        activeTrilha = entry.target.id.replace('trilha-','');
        updateNavActive();
      }
    });
  }, { rootMargin:'-130px 0px -65% 0px', threshold:0 });
  sections.forEach(s=>scrollObserver.observe(s));
}

}

function renderCard(m){
  const t = TRILHAS[m.trilha];
  const p = moduleStatus(m.id);
  const rot = (m.num % 2 === 0) ? '3deg' : '-4deg';
  let statusHtml = `<span class="card-status">Não iniciado</span>`;
  if(p){
    const pass = p.score/p.total >= 0.75;
    statusHtml = `<span class="card-status ${pass?'done':''}">${pass?'✓ ':''}${p.score}/${p.total} no teste</span>`;
  }
  return `
  <button class="module-card" style="--card-color:${t.hex}; --stamp-rot:${rot}" onclick="openModule('${m.id}')">
    <span class="stamp mono">${String(m.num).padStart(2,'0')}</span>
    <span class="card-title">${m.title}</span>
    <span class="card-teaser">${m.teaser}</span>
    <span class="card-foot">
      ${statusHtml}
      <span class="card-cta">Estudar →</span>
    </span>
  </button>`;
}

function goHome(){
  state.view='home'; state.moduleId=null; state.tab='conteudo'; state.answers={};
  renderHome();
  window.scrollTo({top:0, behavior:'instant'});
}

/* ============================================================
   RENDER: MÓDULO (conteúdo + teste)
   ============================================================ */
function openModule(id){
  state.view='module'; state.moduleId=id; state.tab='conteudo'; state.answers={};
  renderModule();
  window.scrollTo({top:0, behavior:'instant'});
}

function switchTab(tab){
  state.tab = tab;
  renderModule();
}

function renderModule(){
  const m = MODULES.find(x=>x.id===state.moduleId);
  const t = TRILHAS[m.trilha];
  const app = document.getElementById('app');
  const prevM = getPrevModule(m);
  const nextM = getNextModule(m);
  app.innerHTML = `
    ${renderTopBanner()}
    ${renderTopbar()}
    <div class="wrap module-view">
      <button class="back-btn" onclick="goHome()">← Voltar para a trilha</button>
      <div class="module-head" style="--card-color:${t.hex}">
        <span class="stamp mono">${String(m.num).padStart(2,'0')}</span>
        <div>
          <span class="module-eyebrow">${t.label}</span>
          <h1>${m.title}</h1>
        </div>
      </div>
      <div class="tabs">
        <button class="tab-btn ${state.tab==='conteudo'?'active':''}" onclick="switchTab('conteudo')">Conteúdo</button>
        <button class="tab-btn ${state.tab==='quiz'?'active':''}" onclick="switchTab('quiz')">Teste (${m.quiz.length} perguntas)</button>
      </div>
      <div id="tab-body"></div>
      <div class="module-nav">
        ${prevM
          ? `<button class="module-nav-btn prev" onclick="openModule('${prevM.id}')"><span class="module-nav-label">← Módulo anterior</span><span class="module-nav-title">${String(prevM.num).padStart(2,'0')} · ${prevM.title}</span></button>`
          : `<span></span>`}
        ${nextM
          ? `<button class="module-nav-btn next" onclick="openModule('${nextM.id}')"><span class="module-nav-label">Próximo módulo →</span><span class="module-nav-title">${String(nextM.num).padStart(2,'0')} · ${nextM.title}</span></button>`
          : `<span class="module-nav-done">🎉 Você chegou ao fim da trilha.</span>`}
      </div>
    </div>
    <div class="wrap">${renderFooter()}</div>
  `;
  activeTrilha = m.trilha;
  updateNavActive();
  const body = document.getElementById('tab-body');
  if(state.tab==='conteudo'){
    body.innerHTML = `<div class="content-panel">${m.content}
      <div class="quiz-actions" style="margin-top:24px;">
        <button class="btn btn-primary" onclick="switchTab('quiz')">Ir para o teste →</button>
      </div>
    </div>`;
  } else {
    renderQuiz(m);
  }
}

function getNextModule(m){ return MODULES.find(x=>x.num === m.num+1) || null; }
function getPrevModule(m){ return MODULES.find(x=>x.num === m.num-1) || null; }

function renderQuiz(m){
  const body = document.getElementById('tab-body');
  const p = moduleStatus(m.id);
  body.innerHTML = `
    <div class="quiz-panel">
      <div class="quiz-score" id="quiz-score"></div>
      <p class="quiz-hint">Responda todas as perguntas e clique em "Corrigir respostas". Você pode refazer quantas vezes quiser.</p>
      <form id="quiz-form">
        ${m.quiz.map((q,qi)=>`
          <fieldset class="question-block" data-qi="${qi}">
            <legend class="q-text">${qi+1}. ${q.q}</legend>
            <ul class="options">
              ${q.options.map((opt,oi)=>`
                <li>
                  <label class="option-label" data-oi="${oi}">
                    <input type="radio" name="q${qi}" value="${oi}">
                    <span>${opt}</span>
                  </label>
                </li>`).join('')}
            </ul>
            <div class="explain" id="explain-${qi}"></div>
          </fieldset>
        `).join('')}
        <div class="quiz-actions">
          <button type="button" class="btn btn-primary" onclick="checkQuiz('${m.id}')">Corrigir respostas</button>
          <button type="button" class="btn btn-ghost" onclick="resetQuiz('${m.id}')">Recomeçar</button>
        </div>
      </form>
    </div>
  `;
  if(p){ showQuizScore(m, p.score, p.total, false); }
}

function checkQuiz(moduleId){
  const m = MODULES.find(x=>x.id===moduleId);
  const form = document.getElementById('quiz-form');
  let answered = 0;
  let score = 0;
  m.quiz.forEach((q,qi)=>{
    const chosen = form.querySelector(`input[name="q${qi}"]:checked`);
    const block = form.querySelector(`.question-block[data-qi="${qi}"]`);
    const labels = block.querySelectorAll('.option-label');
    const explainEl = document.getElementById(`explain-${qi}`);
    labels.forEach(l=>l.classList.remove('correct','wrong'));
    if(chosen){
      answered++;
      const oi = parseInt(chosen.value,10);
      const correctLabel = block.querySelector(`.option-label[data-oi="${q.correct}"]`);
      correctLabel.classList.add('correct');
      if(oi === q.correct){ score++; }
      else{
        block.querySelector(`.option-label[data-oi="${oi}"]`).classList.add('wrong');
      }
    } else {
      const correctLabel = block.querySelector(`.option-label[data-oi="${q.correct}"]`);
      correctLabel.classList.add('correct');
    }
    explainEl.textContent = q.explain;
    explainEl.classList.add('show');
    form.querySelectorAll(`input[name="q${qi}"]`).forEach(inp=>inp.disabled=true);
  });
  showQuizScore(m, score, m.quiz.length, true);
  progress[moduleId] = { score, total:m.quiz.length, date:new Date().toISOString() };
  saveProgress();
}

function showQuizScore(m, score, total, justChecked){
  const el = document.getElementById('quiz-score');
  const pass = score/total >= 0.75;
  const t = TRILHAS[m.trilha];
  const next = getNextModule(m);
  el.classList.add('show');
  el.innerHTML = `
    <span class="stamp mono" style="--card-color:${pass?'var(--correct)':t.hex}">${pass? '✓' : score+'/'+total}</span>
    <span class="quiz-score-body">
      <span>${
        pass
          ? '<strong>Resultado sólido.</strong> Você já domina os pontos-chave deste módulo — vale revisar com o grupo o que ficou menos claro.'
          : `<strong>${score} de ${total} corretas.</strong> Sem problema — releia o conteúdo e tente de novo. O teste é para fixar, não para reprovar.`
      }</span>
      ${next
        ? `<button class="btn btn-primary next-module-btn" onclick="openModule('${next.id}')">Seguir para o módulo ${String(next.num).padStart(2,'0')}: ${next.title} →</button>`
        : `<span class="module-nav-done">🎉 Este é o último módulo da trilha.</span>`}
    </span>
  `;
}

function resetQuiz(moduleId){
  const m = MODULES.find(x=>x.id===moduleId);
  state.answers={};
  renderQuiz(m);
  const scoreEl = document.getElementById('quiz-score');
  if(scoreEl) scoreEl.classList.remove('show');
}

/* ============================================================
   INIT
   ============================================================ */
(function init(){
  loadProgress();
  renderHome();
})();
</script>
</body>
</html>
